name: QA Tests

env:
  BASE_URL_STAGE: https://doktor24.app.staging.platform24.se
  BASE_URL_DEV: https://doktor24.app.dev.platform24.se
  TEST_USER_PERSONAL_ID: ${{ secrets.TEST_USER_PERSONAL_ID }}

on:
  push:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run API tests
        run: python -m pytest tests/api --junitxml=reports/api-results.xml

      - name: Upload API artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-artifacts
          path: reports/

  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run UI smoke tests
        run: python -m pytest tests/ui -m smoke --reruns 1 --reruns-delay 2 --junitxml=reports/ui-results.xml

      - name: Upload UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts
          path: |
            reports/
            screenshots/
            traces/